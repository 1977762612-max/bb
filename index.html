<script>
    const clues = [
        { meta: "档案 I：锁具分析", text: "水箱挂锁没有被撬痕迹，但锁芯内部由于极度低温变得像饼干一样脆，一敲即碎。后台只有特效组用来制造烟雾的‘液氮’能造成这种效果。这意味着凶手不需要钥匙，只需要能接触到后台特效设备即可。" },
        { meta: "档案 II：内部痕迹", text: "水箱内侧玻璃上，离底部 150 厘米处有一处涂抹痕迹。这很奇怪：死者身高 185 厘米，在水中漂浮时，他习惯的书写高度通常在 180 厘米左右。这个 150 厘米的痕迹太低了，倒像是身高较矮的人站在干燥的水箱里留下的。" },
        { meta: "档案 III：操作日志", text: "机器的后台日志显示里，在发现死者溺水时，中控台并没有及时进行排水操作。舞台监督宣称，“屏幕全黑了，我怎么点都没反应！”。当晚确实有黑客入侵，但这似乎太过巧合，且剧场难道没有相关预案？" }
    ];
    
    const loadingTexts = [
        "正在解析：锁具的物理结构 (档案 I)...",
        "正在扫描：水箱内壁的痕迹 (档案 II)...",
        "正在恢复：中控台的操作日志 (档案 III)..."
    ];
    const mathQs = [ {q: "14 + 17", a: 31}, {q: "26 - 12", a: 14}, {q: "9 + 25", a: 34} ];

    // --- 修改 1: 引入分组逻辑 ---
    // 获取 URL 参数 g，如果没有则随机分配 1-3
    let assignedGroup = parseInt(new URLSearchParams(window.location.search).get('g'));
    if (!assignedGroup || assignedGroup < 1 || assignedGroup > 3) {
        assignedGroup = Math.floor(Math.random() * 3) + 1;
    }
    const groupNames = {1: "Linear (匀速)", 2: "Fast-Start (快启动)", 3: "Peak-End (峰终)"};

    let currentRound = 0;
    let experimentData = {
        group: assignedGroup,          // 记录组号
        groupName: groupNames[assignedGroup], // 记录组名方便查看
        rounds: [], 
        finalChoice: "",
        isCorrect: false,
        startTime: Date.now()
    };

    let waitStartTime, currentVerifErrors = 0, currentFidgetClicks = 0, currentClickSkipTime = null;
    // 注意：不再需要 timer 变量，因为我们改用 CSS 动画了

    function nextRound() {
        if (currentRound < clues.length) startWaiting();
        else switchStage('stage-deduction');
    }

    // --- 修改 2: 重写等待函数，使用 CSS 驱动 ---
    function startWaiting() {
        switchStage('stage-loading');
        
        if (currentRound < loadingTexts.length) {
            document.getElementById('loading-title').innerText = loadingTexts[currentRound];
        } else {
            document.getElementById('loading-title').innerText = "正在解密档案...";
        }

        const bar = document.getElementById('progBar');
        
        // 1. 重置进度条状态
        bar.style.transition = 'none'; // 暂时移除动画以便重置
        bar.style.width = "0%"; 
        // 清除所有可能残留的动画类
        bar.classList.remove('mode-linear', 'mode-fast-start', 'mode-peak-end');
        
        // 界面重置
        document.getElementById('math-challenge').classList.add('hidden');
        document.getElementById('skip-wrapper').classList.remove('hidden');
        document.getElementById('math-answer').value = "";
        
        waitStartTime = Date.now();
        currentVerifErrors = 0;
        currentFidgetClicks = 0;
        currentClickSkipTime = null; 

        // 2. 触发动画 (使用 setTimeout 确保 DOM 更新后再添加类)
        setTimeout(() => {
            // 恢复 transition 属性 (移除 inline style)
            bar.style.transition = ''; 
            
            // 根据分组添加对应的动画类
            if (assignedGroup === 1) bar.classList.add('mode-linear');
            if (assignedGroup === 2) bar.classList.add('mode-fast-start');
            if (assignedGroup === 3) bar.classList.add('mode-peak-end');
            
            // 触发动画
            bar.style.width = "100%";
        }, 100);

        // 3. 监听动画结束事件 (代替原本的 setInterval)
        // 当 CSS 动画走完 8秒后，自动调用 finishWaiting
        bar.ontransitionend = () => {
            finishWaiting(false);
        };
    }

    function handleFidget(e) {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        currentFidgetClicks++;
    }

    function clickSkip() {
        if (currentClickSkipTime === null) {
            currentClickSkipTime = Date.now() - waitStartTime;
        }
        document.getElementById('math-question').innerText = mathQs[currentRound].q;
        document.getElementById('skip-wrapper').classList.add('hidden');
        document.getElementById('math-challenge').classList.remove('hidden');
    }

    function checkMath() {
        const val = parseInt(document.getElementById('math-answer').value);
        if (val === mathQs[currentRound].a) {
            // --- 修改 3: 用户验证成功，强制完成动画 ---
            const bar = document.getElementById('progBar');
            
            // 覆盖原有的慢速动画，改为快速填满的视觉反馈
            bar.style.transition = 'width 0.2s ease-out';
            bar.style.width = "100%";
            
            // 稍等一下让用户看到满条
            setTimeout(() => {
                 finishWaiting(true);
            }, 200); 
        } else {
            currentVerifErrors++;
            alert("验证未通过");
            document.getElementById('math-answer').value = "";
        }
    }

    // --- 修改 4: 结束等待的处理 ---
    function finishWaiting(skipped) {
        // 重要：移除事件监听，防止多次触发
        document.getElementById('progBar').ontransitionend = null;
        
        experimentData.rounds.push({
            round: currentRound + 1,
            skipped: skipped,
            verifErrors: currentVerifErrors,
            waitTime_ms: Date.now() - waitStartTime, // 记录实际耗时
            fidgetClicks: currentFidgetClicks,
            timeToClickSkip_ms: currentClickSkipTime 
        });
        
        document.getElementById('clue-meta').innerText = clues[currentRound].meta;
        document.getElementById('clue-text').innerText = clues[currentRound].text;
        switchStage('stage-clue');
        currentRound++;
    }

    function submitVerdict() {
        const sel = document.querySelector('input[name="suspect"]:checked');
        if (!sel) return alert("请指认真凶");
        experimentData.finalChoice = sel.value;
        experimentData.isCorrect = (sel.value === "舞台监督"); // 这里的真凶逻辑未变
        
        const header = document.getElementById('result-header');
        const msg = document.getElementById('result-message');
        if (experimentData.isCorrect) {
            header.innerHTML = '<div class="stamp stamp-success">推理成功</div>';
            msg.innerText = "你的洞察力令人惊叹。你看穿了舞台监督拙劣的误触谎言。";
        } else {
            header.innerHTML = '<div class="stamp stamp-fail">推理失败</div>';
            msg.innerText = "很遗憾。真正的凶手是舞台监督。";
        }
        switchStage('stage-result');
    }

    function goToExport() {
        document.getElementById('final-data').value = JSON.stringify(experimentData, null, 2);
        switchStage('stage-export');
    }

    function switchStage(id) {
        document.querySelectorAll('.main-stage').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function copyData() {
        const txt = document.getElementById('final-data');
        txt.select(); document.execCommand('copy');
        document.getElementById('copy-btn').innerText = "✅ 已复制";
    }
</script>
