<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CASE FILE: THE MAGICIAN'S LAST ACT</title>
    <style>
        :root {
            --bg-paper: #f0e6d2;
            --ink-black: #1a1a1a;
            --stamp-red: #8a3324;
            --success-green: #2e5c34;
            --font-head: 'Courier New', Courier, monospace;
        }
        body { background-color: #1a1510; color: var(--ink-black); font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }
        .container { background-color: var(--bg-paper); width: 90%; max-width: 800px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #3e362e; position: relative; }
        .hidden { display: none; }
        h1, h2, h3 { font-family: var(--font-head); text-transform: uppercase; border-bottom: 2px solid var(--ink-black); padding-bottom: 10px; }
        .btn { background: var(--ink-black); color: white; padding: 10px 20px; border: none; cursor: pointer; font-family: var(--font-head); margin-top: 10px; font-size: 16px; }
        .btn:hover { background: var(--stamp-red); }
        .btn-skip { background: transparent; color: var(--stamp-red); border: 1px dashed var(--stamp-red); padding: 5px 10px; cursor: pointer; font-size: 12px; margin-top: 10px; }
        .clue-box { background: rgba(255,255,255,0.5); padding: 20px; border-left: 5px solid var(--stamp-red); margin: 20px 0; line-height: 1.6; }
        
        .profile-card { background: #e8e1d2; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; font-size: 0.95em; }
        .profile-name { font-weight: bold; color: var(--stamp-red); display: block; margin-bottom: 4px; }
        .profile-motive { font-style: italic; color: #666; display: block; }

        .loader-track { width: 100%; height: 20px; background: #ddd; border: 2px solid var(--ink-black); margin: 20px 0; overflow: hidden; }
        
        /* 核心修改：基础进度条样式 */
        .loader-fill { 
            width: 0%; 
            height: 100%; 
            background: var(--ink-black); 
            /* 默认不设置 transition，由 JS 动态添加 */
        } 

        /* 核心修改：定义三种动画曲线类 */
        /* Group 1: 线性匀速 */
        .mode-linear .loader-fill {
            transition: width 8000ms linear;
        }

        /* Group 2: 快速开始 (Fast Start / Ease Out) - 也是心理学上的 "Early Progress" */
        .mode-fast-start .loader-fill {
            /* 贝塞尔曲线：前段极快，后段平缓 */
            transition: width 8000ms cubic-bezier(0.1, 0.9, 0.2, 1.0);
        }

        /* Group 3: 峰值结尾 (Peak End / Ease In) - 前段极慢，最后冲刺 */
        .mode-peak-end .loader-fill {
            /* 贝塞尔曲线：前段极慢，后段陡峭 */
            transition: width 8000ms cubic-bezier(0.8, 0, 0.9, 1);
        }
        
        #math-challenge { margin-top: 15px; padding: 15px; border: 1px solid #aaa; background: #e8e1d2; text-align: center; }
        input[type="number"] { padding: 5px; width: 60px; font-size: 16px; border: 1px solid var(--ink-black); }
        
        .result-box { padding: 20px; border: 3px double var(--ink-black); margin: 20px 0; background: rgba(0,0,0,0.05); }
        .truth-reveal { font-size: 0.9em; color: #333; margin-top: 15px; border-top: 1px solid #999; padding-top: 10px; }
        .stamp { font-size: 24px; font-weight: bold; transform: rotate(-10deg); display: inline-block; padding: 5px 15px; border: 3px solid; margin-bottom: 15px; }
        .stamp-success { color: var(--success-green); border-color: var(--success-green); }
        .stamp-fail { color: var(--stamp-red); border-color: var(--stamp-red); }
    </style>
</head>
<body>
