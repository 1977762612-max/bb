<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CASE FILE: THE MAGICIAN'S LAST ACT</title>
    <style>
        :root {
            --bg-paper: #f0e6d2;
            --ink-black: #1a1a1a;
            --stamp-red: #8a3324;
            --success-green: #2e5c34;
            --font-head: 'Courier New', Courier, monospace;
            --font-body: 'Georgia', serif;
        }
        
        body { 
            background-color: #1a1510; 
            color: var(--ink-black); 
            font-family: var(--font-body); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; /* 手机端顶部对齐更自然 */
        }

        /* 容器适配手机宽度 */
        .container { 
            background-color: var(--bg-paper); 
            width: 100%; 
            max-width: 600px; /* 限制在大屏上的宽度 */
            padding: 25px 20px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
            border: 2px solid #3e362e; 
            position: relative; 
            box-sizing: border-box; /* 确保padding不撑大宽度 */
        }

        .hidden { display: none; }

        h1 { 
            font-family: var(--font-head); 
            font-size: 22px; /* 手机端字号调整 */
            margin: 0 0 15px 0;
            text-transform: uppercase; 
            border-bottom: 2px solid var(--ink-black); 
            padding-bottom: 10px; 
        }

        h2, h3 { 
            font-family: var(--font-head); 
            text-transform: uppercase; 
            font-size: 18px;
            margin: 15px 0 10px 0;
            border-bottom: 1px solid rgba(26, 26, 26, 0.2);
            padding-bottom: 5px;
        }

        p { line-height: 1.6; font-size: 15px; margin-bottom: 15px; }

        /* 按钮改为全宽，适合手指点击 */
        .btn { 
            background: var(--ink-black); 
            color: white; 
            width: 100%;
            padding: 14px; 
            border: none; 
            cursor: pointer; 
            font-family: var(--font-head); 
            font-size: 18px; 
            margin-top: 15px; 
            font-weight: bold;
            border-radius: 4px; /* 轻微圆角 */
            transition: background 0.2s;
        }
        .btn:active { background: #333; transform: translateY(1px); }

        .btn-skip { 
            background: transparent; 
            color: var(--stamp-red); 
            border: 1px dashed var(--stamp-red); 
            width: 100%;
            padding: 10px; 
            cursor: pointer; 
            font-size: 14px; 
            margin-top: 15px; 
            border-radius: 4px;
        }

            background: rgba(255,255,255,0.6); 
            padding: 15px; 
            border-left: 5px solid var(--stamp-red);
